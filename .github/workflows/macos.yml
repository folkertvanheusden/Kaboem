name: macos

on: [push]

jobs:
  build:

    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
    - name: install sdl3 etc
      run: |
        brew install sdl3 sdl3_ttf libsndfile nlohmann-json fftw fontconfig rtmidi
    - name: cmake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
    - name: make
      run: make -C build
    - name: store artifact in GitHub
      uses: actions/upload-artifact@v4
      with:
        name: my-artifact
        path: build/kaboem
        retention-days: 2
