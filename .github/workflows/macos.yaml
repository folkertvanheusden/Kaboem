name: macos

on:
  push:
    tags:
      - '*'

jobs:
  build:

    runs-on: macos-14

    steps:
    - uses: actions/checkout@v4
    - name: install sdl3 etc
      run: |
        brew install sdl3
    - name: cmake
      run: cmake -B build
    - name: make
      run: make -C build
    - name: store artifact in GitHub
      uses: actions/upload-artifact@v4
      with:
        name: my-artifact
        path: build/kaboem
        retention-days: 2
